<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stok Sparepart</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f3f5f0;--card:#fff;--ink:#1d2a22;--mute:#667269;--line:#d9dfd5;--main:#2f6b45;--warn:#b4531a;--bad:#a32a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
header{background:var(--main);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px;margin:0}
header select{width:130px;padding:6px;border:0;border-radius:6px}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:12px 2px;border:0;background:none;font:inherit;font-size:14px;color:var(--mute);border-bottom:3px solid transparent}
nav button.on{color:var(--main);border-color:var(--main);font-weight:600}
main{padding:14px;max-width:640px;margin:auto}
section{display:none}section.on{display:block}
label{display:block;margin:12px 0 4px;font-weight:600}
label small{font-weight:400;color:var(--mute)}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.row{display:flex;gap:8px}.row>input,.row>select{flex:1}
button.b{padding:10px 14px;border:0;border-radius:8px;background:var(--main);color:#fff;font:inherit;font-weight:600}
button.g{background:#e6ece3;color:var(--main)}
button.full{width:100%;margin-top:16px;padding:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}
small{color:var(--mute)}
.box small{display:block}
.hit{padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:#fff}
.seg{display:flex;gap:8px;margin-top:4px}
.seg label{flex:1;margin:0;font-weight:400;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;background:#fff}
.seg input{display:none}
.seg input:checked+span{font-weight:700;color:var(--main)}
.seg label:has(input:checked){border-color:var(--main);background:#eef5ec}
.warn{color:var(--warn);font-weight:600}
.hide{display:none}
h3{margin:22px 0 0;font-size:16px;padding-top:14px;border-top:1px solid var(--line)}
h3:first-child{border:0;margin-top:0;padding:0}
#msg{position:fixed;left:12px;right:12px;bottom:12px;padding:12px;border-radius:8px;color:#fff;display:none;z-index:20}
#msg.ok{background:var(--main)}#msg.err{background:var(--bad)}
#scan{position:fixed;inset:0;background:#000d;display:none;z-index:30;padding:16px}
#scan .in{background:#fff;border-radius:10px;padding:12px;max-width:420px;margin:40px auto}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.wrap{overflow-x:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#lbl{display:none}
@media print{
 body>*:not(#lbl){display:none!important}
 #lbl{display:block!important}
 .lb{display:flex;gap:.2cm;width:6cm;height:4cm;padding:.25cm;page-break-after:always;overflow:hidden;font-size:8pt;color:#000}
 .lt{flex:1;word-break:break-word}.lt b{font-size:9pt;display:block;margin-bottom:3px}
 .lq img,.lq canvas{width:2.4cm!important;height:2.4cm!important}
 @page{size:6cm 4cm;margin:0}
}
</style>
</head>
<body>
<header><h1>Stok Sparepart</h1><select id="petugas"></select></header>
<nav id="nav">
 <button data-t="masuk" class="on">Masuk</button>
 <button data-t="keluar">Keluar</button>
 <button data-t="stok">Stok</button>
 <button data-t="history">History</button>
 <button data-t="admin">Admin</button>
</nav>
<main>

<section id="masuk" class="on">
 <label>Scan barcode, atau cari item code / nama</label>
 <div class="row"><input id="m_q" oninput="cari('m')"><button class="b g" onclick="scan('m')">Scan</button></div>
 <div id="m_hits"></div><div id="m_item" class="box hide"></div>
 <label>Tanggal kadaluarsa <small id="m_exph">(kosongkan jika tidak ada)</small></label><input id="m_exp" type="date">
 <label>Jumlah masuk <span id="m_sat"></span></label><input id="m_qty" type="number" inputmode="decimal" min="0">
 <button class="b full" onclick="masuk()">Simpan masuk</button>
</section>

<section id="keluar">
 <label>Scan barcode, atau cari item code / nama</label>
 <div class="row"><input id="k_q" oninput="cari('k')"><button class="b g" onclick="scan('k')">Scan</button></div>
 <div id="k_hits"></div><div id="k_item" class="box hide"></div>
 <label>Jumlah keluar <span id="k_sat"></span></label><input id="k_qty" type="number" inputmode="decimal" min="0">
 <label>Tujuan</label>
 <div class="seg">
  <label><input type="radio" name="tj" value="Dipakai" checked onchange="tujuan()"><span>Dipakai</span></label>
  <label><input type="radio" name="tj" value="Dimusnahkan" onchange="tujuan()"><span>Dimusnahkan</span></label>
 </div>
 <div id="k_pakai">
  <label>Nomor GI</label><input id="k_gi">
  <label>Departemen</label><select id="k_dept"></select>
 </div>
 <div id="k_musnah" class="hide"><label>Alasan musnah <small>(opsional)</small></label><input id="k_ket"></div>
 <button class="b full" onclick="keluar()">Simpan keluar</button>
</section>

<section id="stok">
 <div class="row"><input id="s_q" placeholder="Cari item code, nama, lokasi" oninput="renderStok()"><button class="b g" onclick="load()">Muat ulang</button></div>
 <div class="wrap" style="margin-top:10px"><table id="s_tab"></table></div>
</section>

<section id="history">
 <div class="f2">
  <div><label>Dari tanggal</label><input id="h_from" type="date" onchange="renderHist()"></div>
  <div><label>Sampai tanggal</label><input id="h_to" type="date" onchange="renderHist()"></div>
  <div><label>Jenis</label><select id="h_j" onchange="renderHist()">
   <option value="">Semua</option><option value="MASUK">Barang masuk</option>
   <option value="Dipakai">Keluar: dipakai</option><option value="Dimusnahkan">Keluar: dimusnahkan</option></select></div>
  <div><label>PIC</label><select id="h_pic" onchange="renderHist()"></select></div>
  <div><label>Nomor GI</label><input id="h_gi" oninput="renderHist()"></div>
  <div><label>Barang</label><input id="h_q" placeholder="Item code / nama" oninput="renderHist()"></div>
 </div>
 <div class="row" style="margin-top:10px;align-items:center"><small id="h_n" style="flex:1"></small><button class="b g" onclick="loadHist()">Muat ulang</button></div>
 <div class="wrap" style="margin-top:8px"><table id="h_tab"></table></div>
</section>

<section id="admin">
 <h3>Daftarkan barang baru</h3>
 <label>Item code</label><input id="n_kode">
 <label>Nama barang</label><input id="n_nama">
 <label>Satuan</label><input id="n_sat" placeholder="pcs, kg, liter, ...">
 <label>Barcode <small>(scan atau ketik. Kosongkan jika barang tidak punya barcode: dibuatkan otomatis)</small></label>
 <div class="row"><input id="n_bc"><button class="b g" onclick="startScan(t=>$('n_bc').value=t)">Scan</button></div>
 <label>Punya tanggal kadaluarsa?</label>
 <select id="n_exp"><option>Tidak</option><option>Ya</option></select>
 <label>Lokasi rak <small>(opsional)</small></label><input id="n_lok">
 <button class="b full" onclick="tambah()">Simpan barang</button>

 <h3>Cetak label barcode</h3>
 <label>Cari barang</label>
 <input id="a_q" oninput="cari('a')" placeholder="Item code atau nama">
 <div id="a_hits"></div><div id="a_item" class="box hide"></div>
 <label>Jumlah label</label><input id="a_n" type="number" min="1" value="1">
 <button class="b full" onclick="cetakDipilih()">Cetak label</button>
</section>
</main>

<div id="lbl"></div>
<div id="msg"></div>
<div id="scan"><div class="in"><div id="reader"></div><button class="b g full" onclick="stopScan()">Tutup</button></div></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwClwR5vrbW0t9_qTU7_h6bU8vSUb5MT0dYYMh0bRu_0j6ivexSB5TUt2Ce-q47rMVz/exec';

let barang = [], dept = [], pics = [], stok = [], hist = [], sel = {m: null, k: null, a: null}, scanner = null, ses = {pic: '', pin: '', admin: false};
const $ = id => document.getElementById(id), val = id => $(id).value.trim();
const norm = s => String(s == null ? '' : s).trim().replace(/^0+/, '');
const tot = kode => stok.filter(r => r.Kode === kode).reduce((a, r) => a + Number(r.Qty), 0);

async function get(a) { return (await fetch(API + '?action=' + a)).json(); }
async function post(d) {
  d.petugas = ses.pic; d.pin = ses.pin;
  if (!ses.pic) return {ok: false, msg: 'Pilih PIC di bagian atas dan masukkan PIN dulu'};
  return (await fetch(API, {method: 'POST', body: JSON.stringify(d)})).json();
}
async function login(name) {
  ses = {pic: '', pin: '', admin: false};
  if (!name) return;
  const pin = prompt('PIN untuk ' + name);
  if (!pin) { $('petugas').value = ''; return; }
  try {
    const r = await (await fetch(API, {method: 'POST', body: JSON.stringify({action: 'cekpin', petugas: name, pin})})).json();
    if (!r.ok) { $('petugas').value = ''; return toast(r.msg || 'PIN salah', false); }
    ses = {pic: name, pin, admin: !!r.admin}; toast('Masuk sebagai ' + name);
  } catch (e) { $('petugas').value = ''; toast('Tidak bisa terhubung ke server', false); }
}
function toast(t, ok = true) {
  const m = $('msg'); m.textContent = t; m.className = ok ? 'ok' : 'err'; m.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => m.style.display = 'none', 4500);
}
async function load() {
  try {
    const [m, s] = await Promise.all([get('master'), get('stok')]);
    barang = m.barang; dept = m.dept; pics = m.pic; stok = s.stok.filter(r => Number(r.Qty) > 0);
    $('k_dept').innerHTML = dept.map(d => `<option>${d}</option>`).join('');
    const cur = ses.pic;
    $('petugas').innerHTML = '<option value="">Pilih PIC</option>' + pics.map(p => `<option>${p}</option>`).join('');
    $('petugas').value = pics.includes(cur) ? cur : '';
    $('h_pic').innerHTML = '<option value="">Semua</option>' + pics.map(p => `<option>${p}</option>`).join('');
    renderStok();
    ['m', 'k', 'a'].forEach(p => { if (sel[p]) pick(p, barang.find(b => b.Kode === sel[p].Kode)); });
  } catch (e) { toast('Gagal memuat data. Cek URL web app.', false); }
}
$('petugas').onchange = () => login(val('petugas'));

/* navigasi */
$('nav').onclick = async e => {
  const t = e.target.dataset.t; if (!t) return;
  if (t === 'admin' && !ses.admin) return toast(ses.pic ? 'Tab Admin hanya untuk PIC admin' : 'Pilih PIC dan masukkan PIN dulu', false);
  document.querySelectorAll('nav button,section').forEach(x => x.classList.remove('on'));
  e.target.classList.add('on'); $(t).classList.add('on');
  if (t === 'stok') load();
  if (t === 'history') loadHist();
};
async function goAdmin() { document.querySelector('[data-t=admin]').click(); }

/* scanner */
function startScan(cb) {
  $('scan').style.display = 'block';
  scanner = new Html5Qrcode('reader', {formatsToSupport: [
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.QR_CODE]});
  scanner.start({facingMode: 'environment'}, {fps: 10, qrbox: {width: 260, height: 160}},
    txt => { stopScan(); cb(txt.trim()); }, () => {})
    .catch(() => { stopScan(); toast('Kamera tidak bisa dibuka. Izinkan akses kamera.', false); });
}
function stopScan() {
  $('scan').style.display = 'none';
  if (scanner) { scanner.stop().then(() => scanner.clear()).catch(() => {}); scanner = null; }
}
function scan(p) {
  startScan(t => {
    $(p + '_q').value = t;
    const b = barang.find(r => (norm(r.Barcode) && norm(r.Barcode) === norm(t)) || r.Kode === t);
    if (b) pick(p, b);
    else if (confirm('Barcode ' + t + ' belum terdaftar. Daftarkan sebagai barang baru? (perlu PIN admin)')) {
      $('n_bc').value = t; goAdmin();
    }
  });
}

/* pilih barang */
function cari(p) {
  const q = val(p + '_q').toLowerCase(), box = $(p + '_hits');
  sel[p] = null; $(p + '_item').classList.add('hide');
  if (q.length < 2) { box.innerHTML = ''; return; }
  const hit = barang.filter(b => [b.Kode, b.Nama, b.Barcode].join(' ').toLowerCase().includes(q)).slice(0, 6);
  box.innerHTML = hit.map(b => `<div class="hit" data-k="${b.Kode}">${b.Nama}<br><small>${b.Kode} | stok ${tot(b.Kode)} ${b.Satuan}</small></div>`).join('')
    || '<div class="box">Tidak ditemukan. Admin dapat mendaftarkannya di tab Admin.</div>';
  box.querySelectorAll('.hit').forEach(e => e.onclick = () => pick(p, barang.find(b => b.Kode === e.dataset.k)));
}
function pick(p, b) {
  if (!b) return;
  sel[p] = b; $(p + '_hits').innerHTML = ''; $(p + '_q').value = b.Nama;
  const rows = stok.filter(r => r.Kode === b.Kode).sort((x, y) => (x.Expired || '9999').localeCompare(y.Expired || '9999'));
  const exp = rows.filter(r => r.Expired).map(r => `<small>Kadaluarsa ${r.Expired}: ${r.Qty} ${b.Satuan}</small>`).join('');
  const box = $(p + '_item'); box.classList.remove('hide');
  box.innerHTML = `<b>${b.Nama}</b><small>Item code: ${b.Kode} | Lokasi: ${b.Lokasi || '-'}</small>` +
    (p === 'a' ? `<small>Barcode: ${b.Barcode || '-'}</small>` : `<small>Stok saat ini: <b>${tot(b.Kode)} ${b.Satuan}</b></small>${exp}`);
  if ($(p + '_sat')) $(p + '_sat').textContent = '(' + b.Satuan + ')';
  if (p === 'm') $('m_exph').textContent = b['Ada Expired'] === 'Ya' ? '(wajib diisi)' : '(kosongkan jika tidak ada)';
}

/* aksi */
async function masuk() {
  if (!sel.m) return toast('Pilih barang dulu', false);
  const r = await post({action: 'masuk', kode: sel.m.Kode, qty: val('m_qty'), expired: val('m_exp')});
  toast(r.msg, r.ok);
  if (r.ok) { $('m_qty').value = ''; $('m_exp').value = ''; await load(); }
}
function tujuan() {
  const musnah = document.querySelector('[name=tj]:checked').value === 'Dimusnahkan';
  $('k_pakai').classList.toggle('hide', musnah); $('k_musnah').classList.toggle('hide', !musnah);
}
async function keluar() {
  if (!sel.k) return toast('Pilih barang dulu', false);
  const tj = document.querySelector('[name=tj]:checked').value;
  const r = await post({action: 'keluar', kode: sel.k.Kode, qty: val('k_qty'), tujuan: tj,
    departemen: val('k_dept'), gi: val('k_gi'), keterangan: val('k_ket')});
  toast(r.msg, r.ok);
  if (r.ok) { $('k_qty').value = ''; $('k_ket').value = ''; $('k_gi').value = ''; await load(); }
}

/* admin */
async function tambah() {
  const nama = val('n_nama');
  const r = await post({action: 'tambah', kode: val('n_kode'), nama, satuan: val('n_sat'),
    barcode: val('n_bc'), adaExpired: val('n_exp'), lokasi: val('n_lok')});
  toast(r.msg, r.ok);
  if (!r.ok) return;
  ['n_kode', 'n_nama', 'n_sat', 'n_bc', 'n_lok'].forEach(i => $(i).value = '');
  await load();
  if (r.internal && confirm('Barang ini tidak punya barcode. Cetak label sekarang?')) cetak({Kode: r.kode, Nama: nama, Barcode: r.barcode}, 1);
}
function cetakDipilih() {
  if (!sel.a) return toast('Pilih barang dulu', false);
  cetak(sel.a, Math.max(1, Number(val('a_n')) || 1));
}
function cetak(b, n) {
  const box = $('lbl'); box.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div'); d.className = 'lb';
    d.innerHTML = `<div class="lt"><b>${b.Nama}</b><div>${b.Kode}</div><small>${b.Barcode || b.Kode}</small></div><div class="lq"></div>`;
    box.appendChild(d);
    new QRCode(d.querySelector('.lq'), {text: String(b.Barcode || b.Kode), width: 90, height: 90});
  }
  setTimeout(() => window.print(), 600);
}

/* stok */
function renderStok() {
  const q = val('s_q').toLowerCase(), lim = new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);
  const l = barang.map(b => {
    const rs = stok.filter(r => r.Kode === b.Kode);
    const exp = rs.filter(r => r.Expired).map(r => r.Expired).sort()[0] || '';
    const last = rs.filter(r => r['Waktu Update']).sort((x, y) => y['Waktu Update'].localeCompare(x['Waktu Update']))[0];
    return {b, qty: tot(b.Kode), exp, last};
  }).filter(x => !q || [x.b.Kode, x.b.Nama, x.b.Lokasi].join(' ').toLowerCase().includes(q));
  $('s_tab').innerHTML = '<tr><th>Barang</th><th>Stok</th><th>Lokasi</th><th>Kadaluarsa</th></tr>' +
    l.map(x => `<tr><td>${x.b.Nama}<br><small>${x.b.Kode}</small></td>` +
      `<td>${x.qty} ${x.b.Satuan}${x.last ? `<br><small>${x.last['PIC Update']}, ${x.last['Waktu Update'].slice(0, 16)}</small>` : ''}</td>` +
      `<td>${x.b.Lokasi || '-'}</td><td${x.exp && x.exp <= lim ? ' class="warn"' : ''}>${x.exp || '-'}</td></tr>`).join('');
}

/* history */
async function loadHist() {
  try { hist = (await get('history')).rows; renderHist(); } catch (e) { toast('Gagal memuat history', false); }
}
function renderHist() {
  const f = val('h_from'), t = val('h_to'), j = $('h_j').value, gi = val('h_gi').toLowerCase(), p = $('h_pic').value, q = val('h_q').toLowerCase();
  const l = hist.filter(r => {
    const d = r.Waktu.slice(0, 10);
    return (!f || d >= f) && (!t || d <= t) && (!j || (j === 'MASUK' ? r.Jenis === 'MASUK' : r.Tujuan === j)) &&
      (!gi || String(r['No GI']).toLowerCase().includes(gi)) && (!p || r.PIC === p) &&
      (!q || (r.Kode + ' ' + r.Nama).toLowerCase().includes(q));
  });
  $('h_n').textContent = l.length + ' transaksi' + (l.length > 300 ? ' (300 terbaru ditampilkan)' : '');
  $('h_tab').innerHTML = '<tr><th>Waktu</th><th>Barang</th><th>Qty</th><th>Keterangan</th><th>PIC</th></tr>' +
    l.slice(0, 300).map(r => {
      const ket = r.Jenis === 'MASUK' ? 'Masuk' + (r.Expired ? '<br><small>Kadaluarsa ' + r.Expired + '</small>' : '')
        : r.Tujuan === 'Dipakai' ? `Dipakai: ${r.Departemen}<br><small>GI ${r['No GI']}</small>`
        : 'Dimusnahkan' + (r.Keterangan ? '<br><small>' + r.Keterangan + '</small>' : '');
      return `<tr><td>${r.Waktu.slice(0, 16).replace(' ', '<br>')}</td><td>${r.Nama}<br><small>${r.Kode}</small></td>` +
        `<td>${r.Jenis === 'MASUK' ? '+' : '-'}${r.Qty} ${r.Satuan}</td><td>${ket}</td><td>${r.PIC}</td></tr>`;
    }).join('');
}
load();
</script>
</body>
</html>
